name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r skills/excelrouter/requirements.txt
          pip install pytest ruff

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        run: pytest -q
